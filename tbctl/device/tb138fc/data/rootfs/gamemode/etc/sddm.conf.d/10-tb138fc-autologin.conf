# Boot straight into game mode, SteamOS style. Relogin: when a session ends (switching between
# game mode and the desktop), log back in at once instead of showing the greeter. The session
# to use next comes from zz-steamos-autologin.conf (steam-set-session).
# User is set when the image is built (the account is per machine).
[Autologin]
User=@USER@
Session=gamescope-session.desktop
Relogin=true
