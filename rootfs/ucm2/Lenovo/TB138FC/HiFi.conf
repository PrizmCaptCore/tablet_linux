# Lenovo Xiaoxin Pad Pro 2022 (TB138FC): 4x CS35L43 on primary MI2S (I2S, playback on data1).
# Values follow the stock Android mixer_paths.xml "speaker" path: speaker protection DSP
# firmware with Lenovo's tuning, DSP fed by ASPRX1/ASPRX2 (+ boost voltage monitor), gain 17.
# Left: SPK3 (@0x43), SPK4 (@0x40); right: SPK1 (@0x41), SPK2 (@0x42) - verified by ear.

SectionVerb {
	EnableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 1"

		cset "name='SPK1 DSP1 Firmware' Protection"
		cset "name='SPK1 DSP1 Preload Switch' 1"
		cset "name='SPK1 ASPRX1 Slot Position' 1"
		cset "name='SPK1 ASPRX2 Slot Position' 0"
		cset "name='SPK1 DSP RX1 Source' ASPRX1"
		cset "name='SPK1 DSP RX2 Source' ASPRX2"
		cset "name='SPK1 DSP RX3 Source' VBSTMON"
		cset "name='SPK1 PCM Source' DSP"
		cset "name='SPK1 Amp Gain' 17"

		cset "name='SPK2 DSP1 Firmware' Protection"
		cset "name='SPK2 DSP1 Preload Switch' 1"
		cset "name='SPK2 ASPRX1 Slot Position' 1"
		cset "name='SPK2 ASPRX2 Slot Position' 0"
		cset "name='SPK2 DSP RX1 Source' ASPRX1"
		cset "name='SPK2 DSP RX2 Source' ASPRX2"
		cset "name='SPK2 DSP RX3 Source' VBSTMON"
		cset "name='SPK2 PCM Source' DSP"
		cset "name='SPK2 Amp Gain' 17"

		cset "name='SPK3 DSP1 Firmware' Protection"
		cset "name='SPK3 DSP1 Preload Switch' 1"
		cset "name='SPK3 ASPRX1 Slot Position' 0"
		cset "name='SPK3 ASPRX2 Slot Position' 1"
		cset "name='SPK3 DSP RX1 Source' ASPRX1"
		cset "name='SPK3 DSP RX2 Source' ASPRX2"
		cset "name='SPK3 DSP RX3 Source' VBSTMON"
		cset "name='SPK3 PCM Source' DSP"
		cset "name='SPK3 Amp Gain' 17"

		cset "name='SPK4 DSP1 Firmware' Protection"
		cset "name='SPK4 DSP1 Preload Switch' 1"
		cset "name='SPK4 ASPRX1 Slot Position' 0"
		cset "name='SPK4 ASPRX2 Slot Position' 1"
		cset "name='SPK4 DSP RX1 Source' ASPRX1"
		cset "name='SPK4 DSP RX2 Source' ASPRX2"
		cset "name='SPK4 DSP RX3 Source' VBSTMON"
		cset "name='SPK4 PCM Source' DSP"
		cset "name='SPK4 Amp Gain' 17"
	]

	DisableSequence [
		cset "name='PRI_MI2S_RX Audio Mixer MultiMedia1' 0"
	]

	Value {
		TQ "HiFi"
	}
}

SectionDevice."Speaker" {
	Comment "Speakers"

	EnableSequence [
		cset "name='SPK1 AMP Enable Switch' 1"
		cset "name='SPK2 AMP Enable Switch' 1"
		cset "name='SPK3 AMP Enable Switch' 1"
		cset "name='SPK4 AMP Enable Switch' 1"
	]

	DisableSequence [
		cset "name='SPK1 AMP Enable Switch' 0"
		cset "name='SPK2 AMP Enable Switch' 0"
		cset "name='SPK3 AMP Enable Switch' 0"
		cset "name='SPK4 AMP Enable Switch' 0"
	]

	Value {
		PlaybackPriority 100
		PlaybackPCM "hw:${CardId},0"
		PlaybackChannels 2
	}
}
